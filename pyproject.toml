[project]
name = "agent-switch"
version = "0.1.0"
description = "Launch Claude Code, Codex, OpenCode, Pi or DeepSeek Harness against a local OpenAI-compatible model server."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.19.0",
    # start.py imports click directly; typer stopped depending on it in 0.27.
    "click>=8.0",
    "pyyaml>=6",
]

[project.scripts]
agent-switch = "agent_switch.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_switch"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness-only rules plus unused imports. No formatter runs here, so ported files keep their
# original formatting and stay easy to diff against their source.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
